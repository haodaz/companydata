<div id="stage">

<script>
(() => {
'use strict';
const stage = document.getElementById('stage'), cv = document.getElementById('cv');
function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `translate(${-960*s}px,${-540*s}px) scale(${s})`; }
addEventListener('resize', fit); fit();
const DPR = 2; cv.width = 1920*DPR; cv.height = 1080*DPR;
const ctx = cv.getContext('2d'), F = getComputedStyle(document.documentElement).getPropertyValue('--sans');
const V = '#6D5BFF', BL = V, TE = V, GO = V, RO = '#E25C8E', CY = V, FN = '#3E4A6B', GR = V, INK = '#16182B', MU = '#5F6680', DIM = '#9AA0B8';
const clamp = x => Math.max(0, Math.min(1, x)), ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2)/2, prog = (t, a, d) => ease(clamp((t - a)/d)), lerp = (a, b, u) => a + (b - a)*u;
const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const hash = n => { const s = Math.sin(n*127.1 + 311.7)*43758.5453; return s - Math.floor(s); };
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function text(s, x, y, c, a, size, w=700, align='center'){ if (a <= 0) return; ctx.globalAlpha = a; ctx.fillStyle = c; ctx.font = `${w} ${size}px ${F}`; ctx.textAlign = align; ctx.fillText(s, x, y); ctx.globalAlpha = 1; }
function dot(x, y, r, c, a){ if (a <= 0) return; ctx.globalAlpha = a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
function glow(x, y, r, c, a){ if (a <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(c, a)); g.addColorStop(1, rgba(c, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function card(x, y, w, h, r, c, a, lw=2){ if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; rr(x, y, w, h, r); ctx.fillStyle = '#fff'; ctx.fill(); ctx.fillStyle = c ? rgba(c, lw >= 3 ? .045 : .028) : 'rgba(109,91,255,.025)'; ctx.fill(); ctx.strokeStyle = c ? rgba(c, lw >= 3 ? .35 : .16) : 'rgba(22,24,43,.08)'; ctx.lineWidth = lw >= 3 ? 1.6 : 1.1; ctx.stroke(); ctx.restore(); }
function chip(s, x, y, c, a, size=20, fill){ if (a <= 0) return; ctx.font = `800 ${size}px ${F}`; const w = ctx.measureText(s).width + 30, h = size + 18; ctx.globalAlpha = a; rr(x - w/2, y - h/2, w, h, h/2); ctx.fillStyle = fill ? c : 'rgba(255,255,255,.96)'; ctx.fill(); ctx.globalAlpha = 1; text(s, x, y + size*.36, fill ? '#fff' : c, a, size, 800); }
function tick(x, y, s, c, a){ if (a <= 0) return; ctx.globalAlpha = a; ctx.strokeStyle = c; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - s*.5, y); ctx.lineTo(x - s*.1, y + s*.4); ctx.lineTo(x + s*.55, y - s*.4); ctx.stroke(); ctx.globalAlpha = 1; }
function line(x0, y0, x1, y1, c, a, lw=2, dash){ if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.restore(); }
function arrow(x0, y0, x1, y1, c, a){ if (a <= 0) return; line(x0, y0, x1 - 10, y1, c, a, 4); const g = Math.atan2(y1 - y0, x1 - x0); ctx.globalAlpha = a; ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - 20*Math.cos(g - .5), y1 - 20*Math.sin(g - .5)); ctx.lineTo(x1 - 20*Math.cos(g + .5), y1 - 20*Math.sin(g + .5)); ctx.fill(); ctx.globalAlpha = 1; }
function person(x, y, s, c, a){ if (a <= 0) return; ctx.globalAlpha = a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y - s*.45, s*.42, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(x, y + s*.55, s*.72, s*.5, 0, Math.PI, 0); ctx.fill(); ctx.globalAlpha = 1; }

/* ---------- 图表动效的小零件 ---------- */
const TAU = Math.PI*2;
const lens = pts => { const L = [0]; for (let i=1;i<pts.length;i++) L.push(L[i-1] + Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1])); return L; };
function polyAt(pts, u){ u = clamp(u); const L = lens(pts), T = L[L.length - 1]*u; let i = 1; while (i < L.length - 1 && L[i] < T) i++; const f = (T - L[i-1])/((L[i] - L[i-1]) || 1); return [lerp(pts[i-1][0], pts[i][0], f), lerp(pts[i-1][1], pts[i][1], f)]; }
function poly(pts, c, a, lw=2, o={}){ const u = o.u === undefined ? 1 : clamp(o.u); if (a <= 0 || u <= 0) return; const L = lens(pts), T = L[L.length - 1]*u; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; if (o.dash){ ctx.setLineDash(o.dash); ctx.lineDashOffset = o.off || 0; }
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i=1;i<pts.length;i++){ if (L[i] <= T) ctx.lineTo(pts[i][0], pts[i][1]); else { const f = (T - L[i-1])/((L[i] - L[i-1]) || 1); ctx.lineTo(lerp(pts[i-1][0], pts[i][0], f), lerp(pts[i-1][1], pts[i][1], f)); break; } } ctx.stroke(); ctx.restore(); }
function trail(pts, u, len, c, r, a=1){ for (let k=0;k<14;k++){ const v = u - k*len/14; if (v < 0) break; const p = polyAt(pts, v), f = 1 - k/14; dot(p[0], p[1], r*(.3 + .7*f), c, .8*f*f*a); } const p = polyAt(pts, u); glow(p[0], p[1], r*4, c, .5*a); dot(p[0], p[1], r*.55, '#fff', a); }
function ring(x, y, r, c, a, lw=2, o={}){ if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; if (o.dash){ ctx.setLineDash(o.dash); ctx.lineDashOffset = o.off || 0; } ctx.beginPath(); ctx.arc(x, y, r, o.a0 || 0, o.a1 === undefined ? TAU : o.a1); ctx.stroke(); ctx.restore(); }
function cells(x, y, w, h, n, u, c, a, bad){ const g = 3, cw = (w - g*(n - 1))/n, lit = Math.floor(n*clamp(u) + .001); for (let i=0;i<n;i++){ const b = bad && i >= n*.5 && i < n*.74; ctx.globalAlpha = a; rr(x + i*(cw + g), y, cw, h, Math.min(3, cw/2)); ctx.fillStyle = i < lit ? (b ? RO : c) : rgba(c, .1); ctx.fill(); ctx.globalAlpha = 1; } }
function corners(x, y, w, h, c, a, l=26, lw=4){ if (a <= 0) return; [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([p, q, sx, sy]) => poly([[p + sx*l, q], [p, q], [p, q + sy*l]], c, a, lw)); }
function band(x, y, w, h, c, a, vert){ if (a <= 0) return; const g = vert ? ctx.createLinearGradient(x, 0, x + w, 0) : ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, rgba(c, 0)); g.addColorStop(1, rgba(c, .28)); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1; }

function who(x, y, R, c, a, solid){ if (a <= 0) return; ctx.globalAlpha = a; ctx.fillStyle = solid ? c : '#fff'; ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; ring(x, y, R, solid ? '#FFFFFF' : c, a, solid ? 3 : 2.4); person(x, y, R*.62, solid ? '#FFFFFF' : c, a); }
/* ---------- 小零件：横向曲线、三种小图标（人 / 企业 / 成果） ---------- */
function curve(x0, y0, x1, y1, n=24){ const mx = (x0 + x1)/2; return Array.from({ length:n + 1 }, (_, k) => { const u = k/n, a = (1-u)**3, b = 3*(1-u)**2*u, c = 3*(1-u)*u*u, d = u**3; return [a*x0 + (b + c)*mx + d*x1, (a + b)*y0 + (c + d)*y1]; }); }
function icon(kind, x, y, s, c, a){ if (a <= 0) return; if (kind === 0){ person(x, y, s, c, a); return; } ctx.globalAlpha = a; ctx.fillStyle = c; if (kind === 1){ rr(x - s*.72, y - s*.72, s*1.44, s*1.44, s*.28); ctx.fill(); } else { ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s*.85, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s*.85, y); ctx.closePath(); ctx.fill(); } ctx.globalAlpha = 1; }
function disc(x, y, r, c, a, s1, s2, z1=34, z2=20){ if (a <= 0) return; glow(x, y, r*2.2, c, .3*a); ctx.globalAlpha = a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; ring(x, y, r + 12, c, .6*a, 2, { dash:[6, 8], off:t0dash }); text(s1, x, y + (s2 ? -4 : z1*.36), '#FFFFFF', a, z1, 800); if (s2) text(s2, x, y + z2 + 12, 'rgba(255,255,255,.85)', a, z2, 700); }
let t0dash = 0;

/* ---------- ① 院校数字空间：散在各处的东西飞进同一个空间，长成一所学校 ---------- */

  { id:'whyjoin', c:'var(--violet)', sub:'场景平台与持有人各自获得的价值', title:'各方的参与动力', html:`<div data-in=".2" style="left:80px;top:196px;font-size:28px;font-weight:900;color:var(--violet)">场景平台的参与动力</div><div data-in=".2" style="left:980px;top:196px;font-size:28px;font-weight:900;color:var(--ink)">持有人的使用动力</div><div class="bcg" style="top:256px;height:700px;grid-template-columns:repeat(4,1fr);gap:22px"><div class="bc " data-in="0.30"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>降低成本</div><h3>无需自建测评</h3><p>直接采用 <b>ATA 标准与认证</b>。</p></div><div class="bc " data-in="0.40"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>用户质量</div><h3>用户自带档案</h3><p>新用户带有<b>完整过往记录</b>。</p></div><div class="bc n" data-in="0.60"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="6" r="2.5"/><path d="M7.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7.5"/></svg>可迁移</div><h3>记录跨场景保留</h3><p>跨学校、跨雇主、跨平台<b>持续有效</b>。</p></div><div class="bc n" data-in="0.70"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>能力可见</div><h3>优势得到认可</h3><p>真实经历与长处<b>被看见、被认可</b>。</p></div><div class="bc " data-in="0.50"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5"/></svg>公信力</div><h3>结果具备公信力</h3><p>ATA 认证提升<b>外部认可度</b>。</p></div><div class="bc " data-in="0.55"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>生态协同</div><h3>进入 ATA 生态</h3><p>获得投资与连接，<b>相互导流</b>。</p></div><div class="bc n" data-in="0.80"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="12" height="16" rx="2"/><path d="M9 7h4M9 11h4"/><path d="M3 21h18"/></svg>数据自主</div><h3>开放范围由本人决定</h3><p>对象、页面、期限<b>自主设定</b>。</p></div><div class="bc n" data-in="0.85"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M10 10h4v4h-4zM9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>发展指引</div><h3>护照精灵提示方向</h3><p>按阶段提示<b>下一项认证</b>。</p></div></div>` },

  { id:'steps', c:'var(--violet)', sub:'先做实一项认证，再接通一类场景，再形成首批用户', title:'推进路径', html:`<div class="bcg lg" style="top:330px;height:auto;grid-template-columns:repeat(3,1fr)"><div class="bc r" data-in="0.30"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M11 8l2-1v10"/></svg>第一步</div><h3>做实一项新认证</h3><p>AI 能力认证：任务式、全程留痕；<b>先在一至两个职业方向跑通</b>，建立外部认可。</p><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M11 8l2-1v10"/></svg></div></div><div class="bc " data-in="0.50"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 1.7-5 3.7-5 7.5h5"/></svg>第二步</div><h3>接入首批场景平台</h3><p>从已投资、已合作的平台起步，在<b>校招实习、职业技能</b>两类场景各接入一至两家。</p><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 1.7-5 3.7-5 7.5h5"/></svg></div></div><div class="bc " data-in="0.70"><div class="lb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 8h5l-3 3.5a2.8 2.8 0 1 1-2.3 4.3"/></svg>第三步</div><h3>形成首批持有人</h3><p>考试后自动发放护照，护照精灵持续服务；以<b>领取率与授权率</b>衡量。</p><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 8h5l-3 3.5a2.8 2.8 0 1 1-2.3 4.3"/></svg></div></div></div><div class="bline" data-in="1" style="top:880px"><b>推进逻辑</b>先做实认证，再接通场景，再积累持有人；生态逐步形成</div>` },
