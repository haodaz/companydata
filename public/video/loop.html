<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>百业大学 · 影像轮播</title>
<!--
  录片用：全屏轮播几段大学的空镜，每段压一张字卡。
  ?v=book,hands,work  影像（public/college/<名>.mp4）
  &t=好教材|好老师|干真活  每段的中文字卡   &e=Curriculum|Faculty|Real Work  英文
  &d=4  每段秒数
-->
<style>
  html, body { margin: 0; height: 100%; background: #0b0f22; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s ease; }
  video.on { opacity: 1; }
  .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(10,14,32,.65), rgba(10,14,32,0) 45%); pointer-events: none; }
  .cap { position: absolute; left: 140px; bottom: 120px; color: #fff; opacity: 0; transform: translateY(14px); transition: all .7s ease; }
  .cap.on { opacity: 1; transform: none; }
  .cap b { display: block; font: 900 84px/1.1 "Songti SC", "STSong", serif; letter-spacing: .06em; }
  .cap i { display: block; margin-top: 8px; font: italic 400 30px Georgia, serif; color: #d9b878; }
</style></head>
<body>
  <div id="stage"></div><div class="shade"></div>
  <div class="cap" id="cap"><b id="zh"></b><i id="en"></i></div>
  <script>
    const q = new URLSearchParams(location.search);
    const vs = (q.get('v') || 'book,hands,work').split(',');
    const zh = (q.get('t') || '').split('|'), en = (q.get('e') || '').split('|');
    const d = Number(q.get('d') || 4) * 1000;
    const stage = document.getElementById('stage');
    const els = vs.map(v => { const el = document.createElement('video'); el.src = `../college/${v}.mp4`; el.muted = true; el.loop = true; el.playsInline = true; el.preload = 'auto'; stage.appendChild(el); return el; });
    const cap = document.getElementById('cap');
    let i = -1;
    function next() {
      i = (i + 1) % els.length;
      els.forEach((el, k) => { if (k === i) { el.currentTime = 0; el.play(); el.classList.add('on'); } else el.classList.remove('on'); });
      cap.classList.remove('on');
      setTimeout(() => { document.getElementById('zh').textContent = zh[i] || ''; document.getElementById('en').textContent = en[i] || ''; if (zh[i]) cap.classList.add('on'); }, 450);
    }
    // 等第一段能播了再开始（录屏脚本看 window.__ready）
    els[0].addEventListener('canplay', () => { if (i < 0) { next(); setInterval(next, d); window.__ready = true; } }, { once: true });
  </script>
</body></html>
