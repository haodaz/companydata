<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>平方智能 · AI 百业</title>
<meta name="description" content="平方智能 · AI 百业：让 AI 与人升维，构建求真空间的心智智能——怎么造、为什么不会被大模型覆盖">
<style>
/* ===== 平方智能 · AI 百业 · 动态讲述（1920×1080）=====
   一页讲一件事：原理动图（card）之后紧跟百业产品里的真实画面（clip）做呼应；开头先是一段全屏的百业画面（full）。
   只用来出片（不是对外页面）：?render=1 时不自动播，window.show(id, 秒) 定格任意一帧；产品画面由 scripts/video/baiye-story.py 用 ffmpeg 叠进画框。
   时长 / 旁白 / 画面字幕来自 baiye-story/story.js（由出片脚本生成）。 */
*{box-sizing:border-box}
:root{
  --bg:#F7F8FC;--ink:#16182B;--muted:#5F6680;--dim:#9AA0B8;--line:rgba(22,24,43,.09);
  --violet:#6D5BFF;--cyan:#2BB3D9;--mint:#2FBF8F;--gold:#C8891F;--rose:#E25C8E;--ai:#F0652A;--cp:#2F6BFF;--teal:#14A3A0;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
html,body{margin:0;height:100%;background:#0B0F1E;color:var(--ink);font-family:var(--sans);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(1200px 700px at 50% 40%,rgba(109,91,255,.16),transparent 62%),
  radial-gradient(900px 600px at 0% 100%,rgba(43,179,217,.18),transparent 62%),
  radial-gradient(900px 600px at 100% 0%,rgba(255,190,150,.20),transparent 65%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(22,24,43,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(22,24,43,.04) 1px,transparent 1px);
  background-size:60px 60px;mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 70%)}
#stage>*{position:absolute;z-index:1}
#cv{left:0;top:0;width:1920px;height:1080px;z-index:1}
#card{left:0;top:0;width:1920px;height:1080px;z-index:2}
#card *{text-wrap:balance}

/* 页眉 */
.top{left:56px;right:56px;top:34px;height:40px;display:flex;align-items:center;gap:18px;z-index:5}
.top .brand{font-weight:800;font-size:20px;letter-spacing:.12em;color:var(--ink);white-space:nowrap}
.top .brand i{font-style:normal;font-weight:500;color:var(--muted);letter-spacing:.06em;margin-left:10px;font-size:16px}
.top .ch{margin-left:auto;display:flex;gap:8px}
.top .ch span{font:600 13px var(--mono);letter-spacing:.12em;color:var(--dim);padding:6px 14px;border-radius:100px;border:1px solid var(--line);background:rgba(255,255,255,.6);white-space:nowrap}
.top .ch span.on{color:#fff;background:var(--ink);border-color:var(--ink)}
.top img{height:34px}
body.full .top{opacity:0}

/* 卡片页通用 */
.kick{position:absolute;left:120px;top:118px;font:700 16px var(--mono);letter-spacing:.2em;color:var(--c,var(--violet))}
.ttl{position:absolute;left:120px;top:146px;right:120px;font-size:54px;font-weight:800;line-height:1.2;color:var(--ink);letter-spacing:.01em}
.ttl em{font-style:normal;color:var(--c)}
.fade{opacity:0;transform:translateY(14px)}
.on-in{opacity:1;transform:none}

/* 画框页 */
.panel{position:absolute;left:160px;top:200px;width:1600px;height:775px;border-radius:22px;overflow:hidden;background:#0B1020;box-shadow:0 30px 80px rgba(22,24,43,.28);border:1px solid rgba(255,255,255,.6)}
.panel video{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:184px;top:925px;padding:9px 18px;border-radius:12px;background:rgba(11,16,32,.72);color:#fff;font-size:22px;font-weight:600;letter-spacing:.02em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:3;white-space:nowrap}
.cap i{font-style:normal;font:700 13px var(--mono);letter-spacing:.14em;color:#9FE7FF;margin-right:12px}
.ctl{position:absolute;left:160px;top:118px;right:160px;display:flex;align-items:baseline;gap:22px}
.ctl b{font-size:44px;font-weight:800;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
.ctl i{font-style:normal;font:700 15px var(--mono);letter-spacing:.2em;color:var(--c,var(--violet));white-space:nowrap}
/* 全屏页 */
.full{position:absolute;inset:0;background:#000}
.full video{width:100%;height:100%;object-fit:cover}
.fcap{position:absolute;left:72px;top:900px;color:#fff;font-size:24px;font-weight:700;letter-spacing:.04em;text-shadow:0 2px 12px rgba(0,0,0,.6);z-index:3}
.fcap i{display:block;font-style:normal;font:700 14px var(--mono);letter-spacing:.24em;color:#9FE7FF;margin-bottom:6px}
.fbrand{position:absolute;right:72px;top:60px;color:#fff;font-size:22px;font-weight:800;letter-spacing:.16em;text-shadow:0 2px 12px rgba(0,0,0,.6);z-index:3}

/* 三件事 */
.tri{position:absolute;left:120px;right:120px;top:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
.tri div{height:380px;border-radius:28px;background:rgba(255,255,255,.86);border:1px solid #fff;box-shadow:0 20px 60px rgba(22,24,43,.10);padding:44px 40px;position:relative;overflow:hidden}
.tri div::after{content:"";position:absolute;right:-60px;bottom:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent),transparent 70%)}
.tri b{display:block;font-size:110px;line-height:1;font-weight:900;color:var(--c);letter-spacing:.04em}
.tri span{display:block;font-size:34px;font-weight:800;color:var(--ink);margin-top:34px}
.tri small{display:block;font-size:22px;color:var(--muted);margin-top:14px;line-height:1.5}
.gan{position:absolute;left:0;right:0;top:770px;text-align:center;font-size:40px;font-weight:700;color:var(--ink)}
.gan em{font-style:normal;font-size:84px;font-weight:900;color:var(--ai);vertical-align:-8px;margin:0 10px}

/* 问题 */
.qa{position:absolute;left:0;right:0;top:330px;text-align:center}
.qa .l1{font-size:40px;color:var(--muted);font-weight:600}
.qa .l2{font-size:96px;font-weight:900;color:var(--ink);margin-top:40px;letter-spacing:.02em}
.qa .l2 em{font-style:normal;background:linear-gradient(90deg,var(--ai),var(--violet) 55%,var(--cp));-webkit-background-clip:text;background-clip:text;color:transparent}

/* 母版 */
.mgrid{position:absolute;left:120px;right:120px;top:290px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.mgrid div{height:300px;border-radius:22px;overflow:hidden;position:relative;background:#0B1020;box-shadow:0 18px 50px rgba(22,24,43,.16)}
.mgrid div .im{position:absolute;inset:0;background:center/cover no-repeat;opacity:.9}
.mgrid div .tx{position:absolute;left:0;right:0;bottom:0;padding:60px 26px 22px;background:linear-gradient(transparent,rgba(8,12,28,.9));color:#fff}
.mgrid div .tx b{font-size:36px;font-weight:900;letter-spacing:.06em}
.mgrid div .tx span{display:block;font-size:19px;opacity:.85;margin-top:6px}
.mgrid div .tg{position:absolute;left:20px;top:18px;font:700 13px var(--mono);letter-spacing:.14em;color:#fff;background:rgba(255,255,255,.18);padding:5px 11px;border-radius:100px}
.mnote{position:absolute;left:120px;right:120px;top:935px;display:flex;gap:16px;justify-content:center}
.mnote span{font-size:22px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:100px;padding:10px 24px;font-weight:600}

/* 求真清单 */
.chk{position:absolute;left:1180px;top:300px;width:620px;display:grid;gap:14px}
.chk div{display:flex;align-items:center;gap:16px;font-size:26px;color:var(--dim);padding:14px 20px;border-radius:16px;border:1px solid transparent;transition:none}
.chk div i{font:800 16px var(--mono);font-style:normal;color:var(--dim);width:56px}
.chk div.on{color:var(--ink);background:#fff;border-color:var(--line);box-shadow:0 8px 24px rgba(22,24,43,.06)}
.chk div.on i{color:var(--violet)}
.chk div.on::after{content:"✓";margin-left:auto;color:var(--mint);font-weight:900;font-size:30px}
.stamp{position:absolute;left:1290px;top:830px;width:380px;height:110px;border:5px solid var(--gold);border-radius:18px;color:var(--gold);display:grid;place-items:center;text-align:center;font-weight:900;font-size:36px;line-height:1.15;background:rgba(255,250,240,.9);opacity:0}
.stamp small{display:block;font:700 16px var(--sans);letter-spacing:.06em}

/* 心智 */
.tick{position:absolute;left:120px;top:290px;width:640px;height:620px;overflow:hidden;mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.tick .rail{position:absolute;left:0;right:0;top:0}
.ev{height:72px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.ev i{font:700 18px var(--mono);font-style:normal;color:var(--dim)}
.ev span{font-size:26px;padding:12px 20px;border-radius:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.op span{background:rgba(47,107,255,.10);color:#1d3f9a}
.ev.say span{background:rgba(240,101,42,.12);color:#9a3d12}
.ev.hes span{background:rgba(226,92,142,.12);color:#9b2457}
.ret{position:absolute;left:0;right:0;top:930px;text-align:center;font-size:28px;font-weight:700;color:var(--ink);opacity:0}
.ret em{font-style:normal;color:var(--cp)}

/* 结尾 */
.endc{position:absolute;left:0;right:0;top:300px;text-align:center}
.endc .a{font-size:30px;color:var(--muted);font-weight:600}
.endc .b{font-size:100px;font-weight:900;margin-top:36px;line-height:1.15;background:linear-gradient(90deg,#B26A10,var(--ai) 40%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.endc .c{margin-top:46px;display:flex;justify-content:center;gap:16px}
.endc .c span{font-size:26px;font-weight:700;padding:10px 26px;border-radius:100px;background:#fff;border:1px solid var(--line)}
.endc .d{margin-top:50px;font-size:30px;font-weight:800;letter-spacing:.3em;color:var(--ink)}
.endc img{height:64px;margin-top:30px}

/* 网页播放控制 */
#ui{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(11,15,30,.75);color:#fff;font:13px var(--sans);z-index:20}
#ui button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:5px 12px;font:13px var(--sans);cursor:pointer}
#bar{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:3px;position:relative;cursor:pointer}
#bar i{position:absolute;left:0;top:0;bottom:0;background:#9FE7FF;border-radius:3px}
#bar b{position:absolute;top:-3px;width:2px;height:12px;background:rgba(255,255,255,.35)}
#go{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:rgba(11,15,30,.55);cursor:pointer}
#go div{background:#fff;color:var(--ink);border-radius:20px;padding:26px 40px;text-align:center;font-size:22px;font-weight:800;box-shadow:0 30px 80px rgba(0,0,0,.4)}
#go div small{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-top:8px}
body.render #ui,body.render #go{display:none}
/* 出片：全屏页只出字幕层（透明底），画面由 ffmpeg 垫在下面 */
body.render.full,body.render.full #stage{background:transparent}
body.render.full #stage::before,body.render.full #stage::after{display:none}
body.render.full .full{background:transparent}
.fshade{position:absolute;left:0;right:0;bottom:0;height:320px;background:linear-gradient(transparent,rgba(0,0,0,.5));z-index:2}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="card"></div>
  <div class="top"><span class="brand">平方智能<i>AI 百业</i></span><span class="ch" id="chs"></span><img src="baiye-story/img/vs-logo.png" alt="平方创想 VisionSquare"></div>
</div>
<script src="baiye-story/story.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), card = $('card');
const q = new URLSearchParams(location.search), RENDER = true;
if (RENDER) { document.body.classList.add('render'); document.documentElement.style.background = 'transparent'; }
function fit(){ const s = RENDER ? 1 : Math.min(innerWidth/1920, (innerHeight - 46)/1080); stage.style.transform = `translate(${-960*s}px,${-540*s - (RENDER ? 0 : 23)}px) scale(${s})`; }
addEventListener('resize', fit); fit();
const TAU = Math.PI*2, F = getComputedStyle(document.documentElement).getPropertyValue('--sans'), M = getComputedStyle(document.documentElement).getPropertyValue('--mono');
const clamp01 = x => Math.max(0, Math.min(1, x)), ease = x => 1 - Math.pow(1 - clamp01(x), 3), frac = x => x - Math.floor(x);
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const ctx = cv.getContext('2d');
function rr(x, X, Y, W, H, r){ x.beginPath(); x.moveTo(X+r, Y); x.arcTo(X+W, Y, X+W, Y+H, r); x.arcTo(X+W, Y+H, X, Y+H, r); x.arcTo(X, Y+H, X, Y, r); x.arcTo(X, Y, X+W, Y, r); x.closePath(); }
const bez = (p0, p1, p2, p3, u) => { const v = 1-u; return [v*v*v*p0[0]+3*v*v*u*p1[0]+3*v*u*u*p2[0]+u*u*u*p3[0], v*v*v*p0[1]+3*v*v*u*p1[1]+3*v*u*u*p2[1]+u*u*u*p3[1]]; };
const appear = (el, lt, at) => { if (!el) return; const p = ease((lt - at) / 0.6); el.style.opacity = p; el.style.transform = `translateY(${(1-p)*14}px)`; };

const ST = window.STORY || { scenes: {} };
const CH = [['AI 百业',''],['HOW','怎么造'],['VALUE','三样价值'],['ALWAYS','始终的价值']];

// ---------- 场景定义 ----------
const S = [];
const card_ = (id, ch, html, draw) => S.push({ id, ch, kind: 'card', html, draw });
const clip_ = (id, ch, title, kick, c) => S.push({ id, ch, kind: 'clip', title, kick, c });
const full_ = (id, ch) => S.push({ id, ch, kind: 'full' });

full_('intro', 0);

card_('open', 0, () => `<div class="qa"><div class="l1 fade" id="q1">AI 一年一代地迭代，会说、会画、会推理越来越便宜</div><div class="l2 fade" id="q2">平方智能始终握着的<em>核心价值</em></div></div><div class="kick" style="--c:var(--gold)">在 AI 不断迭代的时代</div>`,
  (lt, D) => {
    appear($('q1'), lt, 0.3); appear($('q2'), lt, D * .55);
    ctx.font = `600 22px ${M}`; ctx.textAlign = 'center';
    for (let k = 0; k < 14; k++) { const u = frac(lt * 0.05 + k / 14), x = 160 + (k * 137) % 1600, y = 1000 - u * 900; ctx.fillStyle = `rgba(109,91,255,${0.16 * Math.sin(u * Math.PI)})`; ctx.fillText(`第 ${1 + Math.floor(lt / 2.5 + k) % 9} 代模型`, x, y); }
  });

card_('three', 0, () => `<div class="kick">平方智能 · 三样核心价值</div><div class="ttl">让 AI 与人<em style="--c:var(--ai)">升维</em>，构建<em style="--c:var(--violet)">求真</em>空间的<em style="--c:var(--cp)">心智</em>智能</div>
  <div class="tri"><div class="fade" id="t1" style="--c:var(--ai)"><b>升维</b><span>让 AI 与人一起升维</span><small>人被看见怎么干<br>AI 学会怎么干</small></div><div class="fade" id="t2" style="--c:var(--violet)"><b>求真</b><span>构建求真的空间</span><small>能考、能核、能追溯<br>老手跑得通，老师傅认</small></div><div class="fade" id="t3" style="--c:var(--cp)"><b>心智</b><span>看见人的心智</span><small>过程即证据<br>人连万物</small></div></div>
  <div class="gan fade" id="t4">AI 百业：三样价值落到一个<em>干</em>字上</div>`,
  (lt, D) => { appear($('t1'), lt, 0.4); appear($('t2'), lt, 1.8); appear($('t3'), lt, 3.2); appear($('t4'), lt, D * .62); });

clip_('montage', 0, '干，就是真的动手', 'AI 百业');

const PIPE = ['一份 JD / 职业名', '拆解一天', '统一表示', '母版工位', '环境素材', '求真校验', '老师傅校正', '升维空间'];
card_('how', 1, () => `<div class="kick" style="--c:var(--teal)">HOW · 一个升维空间是怎么造出来的</div><div class="ttl">一条可以复用的流水线：怎么造，本身就是积累</div>`,
  (lt, D) => {
    const n = PIPE.length, X0 = 150, W = 1620, y = 600, step = W / (n - 1), lit = clamp01(lt / (D * 0.85)) * (n - 1);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(22,24,43,.10)'; ctx.beginPath(); ctx.moveTo(X0, y); ctx.lineTo(X0 + W, y); ctx.stroke();
    const g = ctx.createLinearGradient(X0, 0, X0 + W, 0); g.addColorStop(0, '#14A3A0'); g.addColorStop(.5, '#6D5BFF'); g.addColorStop(1, '#F0652A');
    ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(X0, y); ctx.lineTo(X0 + lit * step, y); ctx.stroke();
    for (let k = 0; k < 10; k++) { const u = frac(lt * 0.18 + k / 10); if (u * (n - 1) > lit) continue; ctx.fillStyle = 'rgba(109,91,255,.7)'; ctx.beginPath(); ctx.arc(X0 + u * W, y, 5, 0, TAU); ctx.fill(); }
    PIPE.forEach((nm, i) => {
      const x = X0 + i * step, on = i <= lit + 0.001, cur = Math.abs(i - lit) < 0.5;
      ctx.beginPath(); ctx.arc(x, y, cur ? 34 : 26, 0, TAU); ctx.fillStyle = on ? '#fff' : 'rgba(255,255,255,.6)'; ctx.fill();
      ctx.lineWidth = cur ? 6 : 3; ctx.strokeStyle = on ? (i < 3 ? '#14A3A0' : i < 6 ? '#6D5BFF' : '#F0652A') : 'rgba(22,24,43,.15)'; ctx.stroke();
      ctx.fillStyle = on ? '#16182B' : '#9AA0B8'; ctx.font = `800 20px ${M}`; ctx.textAlign = 'center'; ctx.fillText(String(i + 1).padStart(2, '0'), x, y + 7);
      ctx.font = `${cur ? 800 : 700} ${cur ? 30 : 26}px ${F}`; ctx.fillText(nm, x, i % 2 ? y + 92 : y - 62);
    });
  });

clip_('jd', 1, '起点：一份 JD，或一个职业名', 'HOW · 01');

// 统一表示
const GEN = ['rocket', 'greenhouse', 'converter', 'latte', 'surgery', 'dive'].map(k => `baiye-story/img/${k}.jpg`);
const IMG = {}; [...GEN, 'baiye-story/img/boiler360.jpg'].forEach(s => { const i = new Image(); i.src = s; IMG[s] = i; });
const AX = [['场景', '#14A3A0'], ['状态', '#2BB3D9'], ['操作', '#2F6BFF'], ['规则', '#6D5BFF'], ['目标', '#2FBF8F'], ['一天', '#F0652A']];
function drawImg(src, X, Y, W, H, r){ const im = IMG[src]; ctx.save(); rr(ctx, X, Y, W, H, r); ctx.clip(); if (im && im.complete && im.naturalWidth) { const s = Math.max(W / im.naturalWidth, H / im.naturalHeight); ctx.drawImage(im, X + (W - im.naturalWidth * s) / 2, Y + (H - im.naturalHeight * s) / 2, im.naturalWidth * s, im.naturalHeight * s); } else { ctx.fillStyle = '#0E1430'; ctx.fillRect(X, Y, W, H); } ctx.restore(); }
card_('unify', 1, () => `<div class="kick">HOW · 02 · 统一表示</div><div class="ttl">一门手艺 = 场景 × 状态 × 操作 × 规则 × 目标 × 一天</div>`,
  (lt, D) => {
    const O = { x: 960, y: 560 }, R = 190;
    const SRC = [['AI 生成', '#6D5BFF', 400], ['实拍 360°', '#14A3A0', 560], ['老师傅示范', '#C8891F', 720]];
    const OUT = [['人 · 升维画像', '#F0652A', 400], ['AI · 数字职人', '#6D5BFF', 560], ['组织 · 测评带教', '#2F6BFF', 720]];
    SRC.forEach(([nm, c, y], i) => {
      ctx.globalAlpha = ease(lt - 0.3 - i * 0.3);

    STOCK.forEach(([nm, c], i) => {
      const Y = sy + 30 + i * 112, full = 620, w = full * (.15 + .85 * clamp01(prog * 1.15 - i * .04));
      rr(ctx, sx, Y, full, 84, 18); ctx.fillStyle = 'rgba(22,24,43,.05)'; ctx.fill();
      rr(ctx, sx, Y, w, 84, 18); const lg = ctx.createLinearGradient(sx, 0, sx + w, 0); lg.addColorStop(0, hexA(c, .2)); lg.addColorStop(1, hexA(c, .6)); ctx.fillStyle = lg; ctx.fill();
      ctx.font = `800 28px ${F}`; ctx.fillStyle = '#16182B'; ctx.fillText(nm, sx + 26, Y + 52);
    });
  });

clip_('cover-echo', 3, '同样的方法，越来越多的职业空间', 'ALWAYS · 呼应');

card_('end', 3, () => `<div class="endc"><div class="a fade" id="e1">下一代模型来了，百业的升维空间只会打造得更快、更丰富</div><div class="b fade" id="e2">模型越强，<br>百业越值钱</div><div class="c fade" id="e3"><span style="color:var(--ai)">升维</span><span style="color:var(--violet)">求真</span><span style="color:var(--cp)">心智</span><span>人连万物</span></div><div class="d fade" id="e4">平方智能 · AI 百业 · 用你所做，证你所能</div></div>`,
  (lt, D) => { appear($('e1'), lt, .3); appear($('e2'), lt, D * .45); appear($('e3'), lt, D * .7); appear($('e4'), lt, D * .8); });

// ---------- 时长 ----------
const durOf = s => (ST.scenes[s.id] && ST.scenes[s.id].dur) || 6;
const starts = []; let acc = 0; S.forEach(s => { starts.push(acc); acc += durOf(s); }); const TOTAL = acc;

// ---------- 渲染 ----------
let curId = null, vid = null;
function enter(s){
  curId = s.id; document.body.classList.toggle('full', s.kind === 'full');
  $('chs').innerHTML = CH.map(([a, b], i) => `<span class="${i === s.ch ? 'on' : ''}">${b ? a + ' · ' + b : a}</span>`).join('');
  if (s.kind === 'card') { card.innerHTML = s.html(); vid = null; }
  else {
    const src = `baiye-story/${s.id}.mp4`;
    const media = RENDER ? '' : `<video id="vd" src="${src}" muted playsinline preload="auto"></video>`;
    card.innerHTML = s.kind === 'full'
      ? `<div class="full">${media}</div><div class="fshade"></div><div class="fcap" id="cap"></div><div class="fbrand">平方智能 · AI 百业</div>`
      : `<div class="ctl" style="--c:var(--violet)"><i>${s.kick}</i><b>${s.title}</b></div><div class="panel">${media}</div><div class="cap" id="cap"></div>`;
    vid = $('vd');
  }
}
function capAt(s, lt){
  const cuts = (ST.scenes[s.id] && ST.scenes[s.id].cuts) || []; if (!cuts.length) return '';
  const k = Math.min(cuts.length - 1, Math.floor(lt / (durOf(s) / cuts.length)));
  return s.kind === 'full' ? `<i>AI 百业 · 真实画面</i>${cuts[k]}` : `<i>百业产品 · 真实画面</i>${cuts[k]}`;
}
function show(id, lt){
  const s = S.find(x => x.id === id); if (!s) return;
  if (curId !== id) enter(s);
  ctx.clearRect(0, 0, 1920, 1080);
  if (s.kind === 'card') s.draw(lt, durOf(s));
  else { const c = $('cap'); const h = capAt(s, lt); if (c.innerHTML !== h) c.innerHTML = h; c.style.display = h ? '' : 'none'; }
}
window.show = show; window.SCENES = S.map((s, i) => ({ id: s.id, kind: s.kind, dur: durOf(s), start: starts[i] }));

// 只用来出片：没有播放器，默认停在第一页；?scene=id&t=秒 定格任意一帧
show(q.get('scene') || S[0].id, +(q.get('t') || 0)); window.__ready = true;
})();
</script>
