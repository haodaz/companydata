<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>百业学院 · 片尾</title>
<!-- 《AI 上学记》片尾（2026-10-23）：校训两行 + 院长落款。象牙纸底、深蓝字、金线，照学院证书的气质 -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
    background: #f7f4ec radial-gradient(1200px 700px at 80% 0%, rgba(176,141,87,.16), transparent 60%); color: #16204a; }
  .frame { position: absolute; inset: 44px; border: 1.5px solid rgba(176,141,87,.55); }
  .frame::after { content: ''; position: absolute; inset: 8px; border: 1px solid rgba(22,32,74,.18); }
  .crest { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); width: 140px; height: 140px; animation: up 1s .1s ease-out both; }
  .band { position: absolute; left: 0; right: 0; top: 330px; text-align: center; animation: up 1.2s .5s ease-out both; }
  .k { font: 600 16px Georgia, serif; letter-spacing: .42em; color: #b08d57; margin-bottom: 22px; }
  .motto { font: 900 74px/1.35 "Songti SC", "STSong", serif; letter-spacing: .14em; }
  .motto em { font-style: normal; color: #b08d57; }
  .motto2 { margin-top: 26px; font: 700 40px/1.4 "Songti SC", "STSong", serif; letter-spacing: .22em; color: #2c3768; }
  .rule { width: 120px; height: 1.5px; margin: 44px auto 0; background: linear-gradient(90deg, transparent, #b08d57, transparent); }
  .sign { margin-top: 30px; display: flex; justify-content: center; gap: 70px; font-size: 20px; color: #545b78; letter-spacing: .1em; }
  .sign b { color: #16204a; font-family: "Songti SC", serif; margin-right: 10px; }
  .foot { position: absolute; left: 0; right: 0; bottom: 84px; text-align: center; font: italic 400 20px Georgia, serif; color: #8a8fa6; animation: up 1.2s 1.1s ease-out both; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style></head>
<body>
  <div class="frame"></div>
  <img class="crest" src="../college/crest.svg" alt="院徽" />
  <div class="band">
    <div class="k">校训 · MOTTO</div>
    <div class="motto">AI 强，则<em>百业</em>强；<br />百业兴，则<em>国</em>兴。</div>
    <div class="motto2">立德立言 · 让 AI 实干兴邦</div>
    <div class="rule"></div>
    <div class="sign"><span><b>院长 A</b>教务 AI</span><span><b>好大壮 院长</b>平方智能</span></div>
  </div>
  <div class="foot">Baiye AI College · 平方创想 × 方略研究院</div>
</body></html>
