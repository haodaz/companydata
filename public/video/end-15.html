<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>百业 · 片尾</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d1c; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
  /* 列表页放大 1.45 倍铺满屏宽：卡片大、不显得缩在中间 */
  iframe { position: absolute; left: 0; top: 0; width: calc(100vw / 1.45); height: calc(100vh / 1.45); border: 0; transform: scale(1.45); transform-origin: 0 0; }
  /* 整体一层深色蒙版，字在上面 */
  .mask { position: absolute; inset: 0; background: rgba(10,12,30,.58); pointer-events: none; }
  .band { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; animation: up 1.2s .4s ease-out both; pointer-events: none; }
  .brand { font-size: 20px; letter-spacing: .34em; color: rgba(255,255,255,.78); margin-bottom: 16px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .line { font-size: 60px; font-weight: 800; letter-spacing: .05em; color: #fff; text-shadow: 0 3px 18px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.9); white-space: nowrap; }
  @keyframes up { from { opacity: 0; transform: translateY(-50%) translateY(16px); } to { opacity: 1; transform: translateY(-50%); } }
</style></head>
<body>
  <iframe id="g" src="/lab/gallery"></iframe>
  <div class="mask"></div>
  <div class="band"><div class="brand">AI 百业 · 平方智能 × 方略研究院</div><div class="line">来百业，感受千行百业的门道。</div></div>
  <script>
    // 后面的列表缓缓往上划几行就够，不要滑到底
    const f = document.getElementById('g');
    f.addEventListener('load', () => {
      // 从第一排卡片开始显示（标题 / 筛选条在上面，不露）
      const w = f.contentWindow, doc = f.contentDocument;
      const first = [...doc.querySelectorAll('button')].find(b => /开始体验/.test(b.innerText));
      const card = first ? (first.closest('article') || first.parentElement?.parentElement || first) : null;
      let y = card ? card.getBoundingClientRect().top + w.scrollY - 24 : 160; w.scrollTo(0, y);
      const y1 = y + 480;
      const tick = () => { if (y < y1) { y += 0.5; w.scrollTo(0, y); } requestAnimationFrame(tick); };
      setTimeout(() => requestAnimationFrame(tick), 1200);
    });
  </script>
</body></html>
