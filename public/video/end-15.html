<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>百业 · 片尾</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d1c; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  .wrap { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .brand { font-size: 22px; letter-spacing: .3em; color: #9aa0c8; margin-bottom: 26px; animation: up .9s ease-out both; }
  .line { font-size: 54px; font-weight: 800; letter-spacing: .06em; animation: up 1.1s .3s ease-out both; }
  .sub { margin-top: 22px; font-size: 18px; color: #c7cbe6; animation: up 1.1s .9s ease-out both; }
  .glow { position: absolute; width: 60vw; height: 60vw; border-radius: 50%; background: radial-gradient(circle, rgba(106,92,255,.35), rgba(18,181,203,.12) 45%, transparent 70%); filter: blur(30px); animation: pulse 4s ease-in-out infinite; }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.08); opacity: 1; } }
</style></head>
<body><div class="wrap"><div class="glow"></div><div>
  <div class="brand">AI 百业 · 平方创想 × 方略研究院</div>
  <div class="line">来百业，感受千行百业的门道。</div>
</div></div></body></html>
