<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>百业 · 科研封面</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d1c; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  .bg { position: absolute; inset: -2%; background: url(research-lab.jpg) center / cover no-repeat; filter: saturate(1.05) blur(1.5px); animation: push 12s ease-out both; }
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 62% at 50% 52%, rgba(8,12,28,.9), rgba(8,12,28,.72) 55%, rgba(8,12,28,.4) 100%); }
  .wrap { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .brand { font-size: 22px; letter-spacing: .3em; color: #c7cbe6; margin-bottom: 22px; animation: up .9s .1s ease-out both; }
  .line { font-size: 72px; font-weight: 800; letter-spacing: .05em; line-height: 1.3; animation: up 1.1s .3s ease-out both; text-shadow: 0 4px 24px rgba(0,0,0,.8); }
  .line b { background: linear-gradient(90deg,#ffd166,#ff8a5f); -webkit-background-clip: text; color: transparent; }
  .sub { margin-top: 26px; font-size: 22px; color: #e6e8f5; letter-spacing: .1em; animation: up 1.1s .8s ease-out both; }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes push { from { transform: scale(1.06); } to { transform: scale(1); } }
</style></head>
<body>
  <div class="bg" id="bg"></div><div class="shade" id="shade"></div>
  <div class="wrap"><div>
    <div class="brand" id="brand">AI 百业 · 科研</div>
    <div class="line" id="line">标题</div>
    <div class="sub" id="sub"></div>
  </div></div>
  <!-- ?line=前半|描金后半 &sub=… &brand=… &tint=wine|teal -->
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('sub')) document.getElementById('sub').textContent = q.get('sub');
    if (q.get('brand')) document.getElementById('brand').textContent = q.get('brand');
    if (q.get('line')) { const [a, b] = q.get('line').split('|'); const el = document.getElementById('line'); el.textContent = a; if (b) { el.appendChild(document.createElement('br')); const bb = document.createElement('b'); bb.textContent = b; el.appendChild(bb); } }
    const tints = { teal: 'radial-gradient(ellipse 70% 62% at 50% 52%, rgba(6,30,40,.9), rgba(6,30,40,.72) 55%, rgba(6,30,40,.4) 100%)', wine: 'radial-gradient(ellipse 70% 62% at 50% 52%, rgba(38,10,24,.9), rgba(38,10,24,.72) 55%, rgba(38,10,24,.4) 100%)' };
    if (tints[q.get('tint')]) document.getElementById('shade').style.background = tints[q.get('tint')];
  </script>
</body></html>
