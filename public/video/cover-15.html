<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>百业 · 封面</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d1c; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  /* 十四个空间铺成一幅画：两排、微微错开、轻轻漂 */
  .mosaic { position: absolute; left: -3vw; right: -3vw; top: 0; bottom: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 1fr 1fr; gap: 10px; padding: 10px; transform: rotate(-3deg) scale(1.08); }
  figure { margin: 0; position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.5); animation: drift 9s ease-in-out infinite; animation-delay: calc(var(--i) * -0.7s); }
  figure:nth-child(odd) { transform: translateY(14px); }
  figure img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(1.05); }
  figcaption { position: absolute; left: 10px; bottom: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse 62% 55% at 50% 50%, rgba(10,12,30,.92), rgba(10,12,30,.72) 55%, rgba(10,12,30,.35) 100%); }
  .wrap { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .badge { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .14em; padding: 6px 12px; border-radius: 8px; background: linear-gradient(120deg,#ff5fa2,#6a5cff); margin-bottom: 26px; animation: up .8s ease-out both; }
  .brand { font-size: 22px; letter-spacing: .3em; color: #c7cbe6; margin-bottom: 18px; animation: up .9s .1s ease-out both; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .line { font-size: 68px; font-weight: 800; letter-spacing: .06em; line-height: 1.25; animation: up 1.1s .3s ease-out both; text-shadow: 0 4px 24px rgba(0,0,0,.8); }
  .line b { background: linear-gradient(90deg,#ffd166,#ff8a5f); -webkit-background-clip: text; color: transparent; }
  .sub { margin-top: 24px; font-size: 19px; color: #e6e8f5; letter-spacing: .1em; animation: up 1.1s .8s ease-out both; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
</style></head>
<body>
  <div class="mosaic"><figure style="--i:0"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/seed-or_hall.jpg" alt=""><figcaption>外科医生</figcaption></figure><figure style="--i:1"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/seed-latte_cafe.jpg" alt=""><figcaption>咖啡师</figcaption></figure><figure style="--i:2"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mv3wd8l17nhn-open_office_workstation.jpg" alt=""><figcaption>数据分析师</figcaption></figure><figure style="--i:3"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mupt5ju9b1kj-maternity_suite_room.jpg" alt=""><figcaption>月嫂</figcaption></figure><figure style="--i:4"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mv38sqq1gqw5-paper_archive.jpg" alt=""><figcaption>古籍修复师</figcaption></figure><figure style="--i:5"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mv3yk5lqvln3-er_resuscitation_room.jpg" alt=""><figcaption>急诊护士</figcaption></figure><figure style="--i:6"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mv3ywrvog0l6-prep_fridge_station.jpg" alt=""><figcaption>中餐厨师</figcaption></figure><figure style="--i:7"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mv3z0q5fgtvx-client_audit_room.jpg" alt=""><figcaption>审计师</figcaption></figure><figure style="--i:8"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mupsyg29jl6u-dive_shop_reception.jpg" alt=""><figcaption>潜导</figcaption></figure><figure style="--i:9"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mv3yn5rx1mgs-control_cabinet_area.jpg" alt=""><figcaption>电气维修工</figcaption></figure><figure style="--i:10"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mv3yrcpvpl4m-contact_center_floor.jpg" alt=""><figcaption>客服主管</figcaption></figure><figure style="--i:11"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mv3zedh2a3vz-landscape_planting_site.jpg" alt=""><figcaption>园艺师</figcaption></figure><figure style="--i:12"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mv3z9z8kmvg1-control_desk.jpg" alt=""><figcaption>直播中控</figcaption></figure><figure style="--i:13"><img src="https://jextsfzlbchbnsnxwgeu.supabase.co/storage/v1/object/public/lab-art/mv3z769ft9is-kindergarten_classroom.jpg" alt=""><figcaption>幼儿园老师</figcaption></figure></div>
  <div class="shade"></div>
  <div class="wrap"><div>
    <div class="badge" id="badge">3D 沉浸版 · BETA</div>
    <div class="brand" id="brand">AI 百业 · 平方智能 × 方略研究院</div>
    <div class="line" id="line">百业：用你所做，<b>证你所能</b></div>
    <div class="sub" id="sub">来百业，体验职业的一日 · 每一种都亲手做一做</div>
  </div></div>
  <!-- 同一张画换文案：?sub=…（3 分钟版副题）、?line=…（主标题，| 后面的部分描金）、?brand=…、?badge=0（分享图 og.jpg 用） -->
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('sub')) document.getElementById('sub').textContent = q.get('sub');
    if (q.get('brand')) document.getElementById('brand').textContent = q.get('brand');
    if (q.get('line')) { const [a, b] = q.get('line').split('|'); const el = document.getElementById('line'); el.textContent = a; if (b) { const bb = document.createElement('b'); bb.textContent = b; el.appendChild(bb); } }
    if (q.get('badge') === '0') document.getElementById('badge').style.display = 'none';
    // 新一版封面：字大一档、蒙版换色，和上一版一眼能分开（?big=1&tint=teal）
    if (q.get('big')) { document.querySelector('.line').style.fontSize = '80px'; document.querySelector('.brand').style.fontSize = '25px'; document.querySelector('.sub').style.fontSize = '23px'; }
    const tints = { teal: 'radial-gradient(ellipse 62% 55% at 50% 50%, rgba(6,32,40,.93), rgba(6,32,40,.74) 55%, rgba(6,32,40,.38) 100%)', wine: 'radial-gradient(ellipse 62% 55% at 50% 50%, rgba(40,8,24,.93), rgba(40,8,24,.74) 55%, rgba(40,8,24,.38) 100%)', sky: 'radial-gradient(ellipse 62% 55% at 50% 50%, rgba(36,70,120,.9), rgba(36,70,120,.7) 55%, rgba(36,70,120,.34) 100%)' };
    if (tints[q.get('tint')]) document.querySelector('.shade').style.background = tints[q.get('tint')];
  </script>
</body></html>
