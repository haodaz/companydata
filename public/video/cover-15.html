<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>百业 · 封面</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d1c; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  .wrap { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .badge { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .14em; padding: 6px 12px; border-radius: 8px; background: linear-gradient(120deg,#ff5fa2,#6a5cff); margin-bottom: 30px; animation: up .8s ease-out both; }
  .brand { font-size: 26px; letter-spacing: .3em; color: #9aa0c8; margin-bottom: 18px; animation: up .9s .1s ease-out both; }
  .line { font-size: 64px; font-weight: 800; letter-spacing: .04em; line-height: 1.3; animation: up 1.1s .3s ease-out both; }
  .line b { background: linear-gradient(90deg,#ffd166,#ff8a5f); -webkit-background-clip: text; color: transparent; }
  .sub { margin-top: 26px; font-size: 20px; color: #c7cbe6; letter-spacing: .08em; animation: up 1.1s .8s ease-out both; }
  .glow { position: absolute; width: 70vw; height: 70vw; border-radius: 50%; background: radial-gradient(circle, rgba(106,92,255,.35), rgba(255,95,162,.12) 45%, transparent 70%); filter: blur(30px); animation: pulse 5s ease-in-out infinite; }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.08); opacity: 1; } }
</style></head>
<body><div class="wrap"><div class="glow"></div><div>
  <div class="badge">3D 沉浸版 · BETA</div>
  <div class="brand">AI 百业</div>
  <div class="line">百业：证明你能力，<br><b>从你所做开始。</b></div>
  <div class="sub">十四种职业的一天 · 每一种都亲手做一做</div>
</div></div></body></html>
