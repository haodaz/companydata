<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>AI 上学记 · 封面</title>
<!-- 《AI 上学记》封面（2026-10-23）：沿用百业学院介绍片的版式（晨光阅览厅空镜、左对齐、校徽 + 校名、标题后半金色），只换字 -->
<style>
  html, body { margin: 0; height: 100%; background: #1b1610; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  .bg { position: absolute; inset: -2%; background: url(../college/book.jpg) center / cover no-repeat; animation: push 12s ease-out both; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,14,32,.8) 0%, rgba(10,14,32,.48) 42%, rgba(10,14,32,0) 72%), linear-gradient(0deg, rgba(10,14,32,.55), rgba(10,14,32,0) 55%); }
  .wrap { position: absolute; left: 140px; right: 140px; bottom: 140px; }
  .crest { display: flex; align-items: center; gap: 26px; margin-bottom: 40px; animation: up .9s .1s ease-out both; }
  .crest img { width: 150px; height: 150px; filter: drop-shadow(0 12px 30px rgba(0,0,0,.45)); }
  .crest b { display: block; font: 900 40px "Songti SC", "STSong", serif; letter-spacing: .32em; color: #f3dfae; }
  .crest small { display: block; margin-top: 10px; font: 600 15px Georgia, serif; letter-spacing: .42em; color: rgba(217,184,120,.9); }
  .kicker { font: 600 22px Georgia, serif; letter-spacing: .34em; color: rgba(217,184,120,.95); margin-bottom: 14px; animation: up 1s .25s ease-out both; }
  .line { font: 900 120px/1.12 "Songti SC", "STSong", serif; letter-spacing: .06em; text-shadow: 0 4px 30px rgba(0,0,0,.4); animation: up 1.1s .3s ease-out both; }
  .line em { font-style: normal; background: linear-gradient(100deg, #d9b878, #f3dfae 45%, #b08d57); -webkit-background-clip: text; color: transparent; }
  .en { margin-top: 18px; font: italic 400 32px Georgia, "Times New Roman", serif; color: rgba(255,255,255,.9); animation: up 1.1s .6s ease-out both; }
  .sub { margin-top: 28px; display: inline-flex; align-items: center; gap: 14px; font-size: 25px; color: rgba(255,255,255,.9); letter-spacing: .08em; animation: up 1.1s .9s ease-out both; }
  .sub::before { content: ''; width: 46px; height: 2px; background: #d9b878; }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes push { from { transform: scale(1.06); } to { transform: scale(1); } }
</style></head>
<body>
  <div class="bg"></div><div class="shade"></div>
  <div class="wrap">
    <div class="crest"><img src="../college/crest.svg" alt="百業學院院徽" /><div><b>百業學院</b><small>BAIYE AI COLLEGE</small></div></div>
    <div class="kicker">第一届 · CLASS OF 2026</div>
    <div class="line">AI <em>上学记</em></div>
    <div class="en">A model goes to school — and comes back a professional.</div>
    <div class="sub" id="sub">一个通用大模型的入学、拜师、考核与毕业</div>
  </div>
  <script>const q = new URLSearchParams(location.search); if (q.get('sub')) document.getElementById('sub').textContent = q.get('sub');</script>
</body></html>
