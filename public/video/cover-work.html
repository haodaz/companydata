<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>百业AI｜真活 · 封面</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f7fb; color: #1a1a2e; font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  /* 四种操作台 + 报告的真实截图铺底，微微错开、轻轻漂 */
  .mosaic { position: absolute; left: -4vw; right: -4vw; top: -4vh; bottom: -4vh; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 14px; padding: 14px; transform: rotate(-4deg) scale(1.12); opacity: .55; }
  figure { margin: 0; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 50px rgba(20,24,60,.18); animation: drift 9s ease-in-out infinite; animation-delay: calc(var(--i) * -0.8s); background: #fff; }
  figure:nth-child(odd) { transform: translateY(16px); }
  figure img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 58% at 50% 50%, rgba(246,247,251,.97), rgba(246,247,251,.86) 55%, rgba(246,247,251,.5) 100%); }
  .wrap { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .badge { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .16em; padding: 6px 14px; border-radius: 999px; color: #fff; background: linear-gradient(120deg,#6055f5,#12b5cb); margin-bottom: 26px; animation: up .8s ease-out both; }
  .brand { font-size: 22px; letter-spacing: .3em; color: #4a4f66; margin-bottom: 18px; animation: up .9s .1s ease-out both; }
  .line { font-size: 84px; font-weight: 800; letter-spacing: .04em; line-height: 1.2; animation: up 1.1s .3s ease-out both; }
  .line b { background: linear-gradient(90deg,#6055f5,#12b5cb); -webkit-background-clip: text; color: transparent; }
  .sub { margin-top: 26px; font-size: 22px; color: #3b405a; letter-spacing: .08em; animation: up 1.1s .8s ease-out both; }
  .sub i { font-style: normal; color: #6055f5; font-weight: 700; }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
</style></head>
<body>
  <div class="mosaic">
    <figure style="--i:0"><img src="/work/shot-sheet.png" alt=""></figure>
    <figure style="--i:1"><img src="/work/shot-code.png" alt=""></figure>
    <figure style="--i:2"><img src="/work/shot-design.png" alt=""></figure>
    <figure style="--i:3"><img src="/work/shot-report.png" alt=""></figure>
    <figure style="--i:4"><img src="/work/shot-doc.png" alt=""></figure>
    <figure style="--i:5"><img src="/work/shot-landing.png" alt=""></figure>
  </div>
  <div class="shade"></div>
  <div class="wrap"><div>
    <div class="badge" id="badge">真活台 · REAL WORK</div>
    <div class="brand" id="brand">百业AI｜真活 · 平方智能</div>
    <div class="line" id="line">寻找真人才，<b>看他干真活</b></div>
    <div class="sub" id="sub"><i>生成真实问题</i> · <i>智能评价考核</i> · <i>记录过程评估</i></div>
  </div></div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('sub')) document.getElementById('sub').textContent = q.get('sub');
    if (q.get('brand')) document.getElementById('brand').textContent = q.get('brand');
    if (q.get('line')) { const [a, b] = q.get('line').split('|'); const el = document.getElementById('line'); el.textContent = a; if (b) { const bb = document.createElement('b'); bb.textContent = b; el.appendChild(bb); } }
    if (q.get('badge') === '0') document.getElementById('badge').style.display = 'none';
  </script>
</body></html>
