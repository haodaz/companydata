<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>实验方法 · 图卡</title>
<!-- 《一份展会数据，喂进三个地方》短片的图卡（2026-11-02）：1600×900 设计，和 chart-ai.html 同一套浅色 + 玻璃卡。?id=flow|layer -->
<style>
  :root { --ink: #161a33; --ink2: #4a4f6a; --ink3: #8a8fa8; --v: #6055f5; --c: #12b5cb; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; background: #f7f8ff; }
  .bg { position: absolute; inset: 0; overflow: hidden; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 14s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { width: 760px; height: 760px; left: -220px; top: -260px; background: #cfc8ff; }
  .bg i:nth-child(2) { width: 680px; height: 680px; right: -200px; top: 120px; background: #bff0f7; animation-delay: -4s; }
  .bg i:nth-child(3) { width: 560px; height: 560px; left: 38%; bottom: -320px; background: #d9f7e3; animation-delay: -8s; }
  .bg::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(96,85,245,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(96,85,245,.06) 1px, transparent 1px); background-size: 48px 48px; }
  @keyframes drift { to { transform: translate(40px, 30px) scale(1.06); } }
  .page { position: absolute; inset: 0; padding: 60px 96px; box-sizing: border-box; }
  .eb { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: var(--v); letter-spacing: .08em; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid rgba(96,85,245,.18); animation: up .6s both; }
  .eb b { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--v), var(--c)); }
  h1 { font-size: 62px; line-height: 1.15; margin: 22px 0 0; font-weight: 900; animation: up .7s .1s both; }
  h1 em { font-style: normal; background: linear-gradient(120deg, var(--v), var(--c)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .glass { background: rgba(255,255,255,.75); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 30px 70px -30px rgba(40,44,110,.28), 0 2px 10px rgba(40,44,110,.06); border-radius: 28px; }
  @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }

  /* flow：左一个源头 → 右三个去处 */
  .flow { display: grid; grid-template-columns: 470px 120px 1fr; align-items: center; margin-top: 46px; }
  .src { padding: 34px 36px; animation: up .7s .3s both; }
  .src .k { font-size: 19px; letter-spacing: .12em; color: var(--ink3); font-weight: 700; }
  .src h3 { margin: 8px 0 14px; font-size: 34px; font-weight: 900; line-height: 1.3; }
  .src .big { font-size: 76px; font-weight: 900; line-height: 1; background: linear-gradient(120deg, var(--v), var(--c)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .src .big small { font-size: 26px; color: var(--ink2); -webkit-text-fill-color: var(--ink2); font-weight: 700; margin-left: 8px; }
  .src p { margin: 12px 0 0; font-size: 23px; color: var(--ink2); }
  .src .cost { display: inline-block; margin-top: 16px; font-size: 22px; font-weight: 800; color: #0d7a52; background: #e3f8ec; padding: 6px 16px; border-radius: 12px; }
  .arrows { position: relative; height: 520px; }
  .arrows i { position: absolute; left: 10px; right: 0; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--v), var(--c)); transform-origin: left; animation: grow .6s both; }
  .outs { display: grid; gap: 22px; }
  .out { display: grid; grid-template-columns: 84px 1fr; gap: 22px; align-items: center; padding: 22px 30px; animation: up .7s both; animation-delay: calc(.7s + var(--i) * .25s); }
  .out .ic { width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; font-size: 40px; }
  .out h3 { margin: 0 0 4px; font-size: 34px; font-weight: 900; }
  .out p { margin: 0; font-size: 22px; color: var(--ink2); line-height: 1.45; }
  .out.hl { box-shadow: 0 0 0 3px rgba(96,85,245,.55), 0 30px 70px -30px rgba(40,44,110,.35); }

  /* layer：学科 ↔ 方法 ↔ 产品 三层 */
  .layers { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 0; align-items: center; margin-top: 60px; }
  .col { padding: 30px 32px; animation: up .7s both; animation-delay: calc(.3s + var(--i) * .3s); }
  .col .k { font-size: 19px; letter-spacing: .12em; color: var(--ink3); font-weight: 700; }
  .col h3 { margin: 6px 0 14px; font-size: 38px; font-weight: 900; }
  .col .n { font-size: 26px; font-weight: 800; color: var(--v); margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips span { font-size: 20px; padding: 6px 13px; border-radius: 10px; background: #f1f0ff; color: #3f35c4; font-weight: 600; }
  .mid { position: relative; z-index: 2; transform: scale(1.04); box-shadow: 0 0 0 3px rgba(96,85,245,.5), 0 40px 90px -30px rgba(96,85,245,.45); }
  .mid .chips span { background: linear-gradient(135deg, #6055f5, #12b5cb); color: #fff; }
  .link { height: 4px; margin: 0 -6px; background: linear-gradient(90deg, var(--v), var(--c)); }
  .under { display: flex; gap: 18px; justify-content: center; margin-top: 40px; animation: up .7s 1.4s both; }
  .under i { font-style: normal; font-size: 24px; font-weight: 800; padding: 12px 22px; border-radius: 16px; background: rgba(255,255,255,.85); border: 1px solid rgba(96,85,245,.2); color: var(--ink); }
  .under i b { color: var(--v); }
</style></head>
<body><div class="bg"><i></i><i></i><i></i></div><div class="page" id="p"></div>
<script>
const q = new URLSearchParams(location.search);
const id = q.get('id') || 'flow';
const N = { prod: q.get('prod') || '8,863', sup: q.get('sup') || '1,095', methods: q.get('methods') || '121', linked: q.get('linked') || '', items: q.get('items') || '' };
const EB = '<div class="eb"><b></b>平方数据工厂 · 一份数据用三处</div>';
const P = {
  flow: `${EB}<h1>一份展会会刊，<em>喂进三个地方</em></h1>
    <div class="flow">
      <div class="src glass"><div class="k">带回来的数据</div><h3>慕尼黑上海<br>分析生化展 · 在线会刊</h3>
        <div class="big">${N.prod}<small>条产品</small></div><p>${N.sup} 家厂商 · 仪器、试剂、耗材</p><div class="cost">花了约 ¥90</div></div>
      <div class="arrows"><i style="top:95px;transform:rotate(-24deg);animation-delay:.6s"></i><i style="top:258px;animation-delay:.8s"></i><i style="top:421px;transform:rotate(24deg);animation-delay:1s"></i></div>
      <div class="outs">
        ${[['🏢', '#eef0ff', '企业库', '厂商建档：做什么、在哪、有哪些产品'],
           ['🔬', '#e6f8fb', '方略研选', '仪器设备的评价和推荐：按型号比、按需求找'],
           ['🧪', '#e9f9ef', '百业', '科研空间多了真实的仪器、试剂，和操作指南']]
          .map(([ic, bg, h, p], i) => `<div class="out glass ${i === 2 ? 'hl' : ''}" style="--i:${i}"><div class="ic" style="background:${bg}">${ic}</div><div><h3>${h}</h3><p>${p}</p></div></div>`).join('')}
      </div>
    </div>`,
  layer: `${EB}<h1>中间加一层：<em>实验方法</em></h1>
    <div class="layers">
      <div class="col glass" style="--i:0"><div class="k">往上接</div><h3>学科 · 课题</h3><div class="chips">${['生物学', '化学', '材料', '药学', '环境'].map(x => `<span>${x}</span>`).join('')}</div></div>
      <div class="col glass mid" style="--i:1"><div class="k">中间层 · 研究生说「我会做」的手艺</div><h3>实验方法</h3><div class="n">${N.methods} 个 · 每个一份操作指南</div><div class="chips">${['细胞培养', '液相色谱', 'Western blot', '电化学测试', '共聚焦成像'].map(x => `<span>${x}</span>`).join('')}</div></div>
      <div class="col glass" style="--i:2"><div class="k">往下接</div><h3>仪器 · 试剂</h3><div class="chips">${['CO₂ 培养箱', '生物安全柜', '色谱柱', '酶标仪'].map(x => `<span>${x}</span>`).join('')}</div></div>
    </div>
    <div class="under"><i>步骤</i><i>新手常踩的坑</i><i>安全要点</i><i>练的本事</i><i>库里的真实型号</i></div>`,
};
document.getElementById('p').innerHTML = P[id] || P.flow;
</script></body></html>
